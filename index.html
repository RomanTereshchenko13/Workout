<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <!-- No maximum-scale: locking zoom fails WCAG 1.4.4, and nothing in the
       layout depends on it — the whole app is a single scrolling column. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Home Workout</title>
  <meta name="description" content="Персональна програма тренувань під дві набірні гантелі до 20 кг: сила, схуднення, трекер ваги. Працює офлайн." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0e1116" />
  <meta name="color-scheme" content="dark" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Home Workout" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css?v=__BUILD__" />
</head>
<body>
  <main id="app" class="app"></main>
  <nav id="tabs" class="tabs" aria-label="Розділи застосунку"></nav>
  <!--
    No ?v= on this one, deliberately. The views import '../app.js', and ES modules
    are keyed by URL — a query string here would make the browser evaluate app.js
    twice, giving the router, the service-worker registration and the install
    state two independent copies. Cache-busting is already covered: the service
    worker fetches every asset with cache:'reload' into a build-scoped cache.
    check-assets.mjs fails the build if a query string comes back.
  -->
  <script type="module" src="./js/app.js"></script>
  <noscript>Для роботи застосунку потрібен JavaScript.</noscript>
</body>
</html>
